function renderDate(dateStr) {

    document.getElementById('currentDate').textContent = dateStr;
    return;
  }
  const d = new Date(dateStr);
  const weekday = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('currentDate').textContent = dateStr + ' 周' + weekday;
  let html = '';
  html += '<div class="section-header"><span class="dot fresh"></span> 新鲜案例</div>';
  data.fresh.forEach(c => {
    html += '<div class="case-card"><div class="case-title"><span class="case-num">#' + c.num + '</span>' + c.title + '</div><div class="case-meta"><span>' + (c.brand || '') + '</span>' + (c.agency ? '<span class="tag">' + c.agency + '</span>' : '') + '</div><div class="case-detail">';
    if (c.goal) html += '<div class="field"><span class="label">商业目标</span>' + c.goal + '</div>';
    if (c.problem) html += '<div class="field"><span class="label">核心问题</span>' + c.problem + '</div>';
    if (c.insight) html += '<div class="field"><span class="label">核心洞察</span>' + c.insight + '</div>';
    if (c.task) html += '<div class="field"><span class="label">传播任务</span>' + c.task + '</div>';
    if (c.idea) html += '<div class="field"><span class="label">创意构思</span>' + c.idea + '</div>';
    if (c.link) html += '<div class="field"><a class="link" href="' + c.link + '" target="_blank" rel="noopener">🔗 查看原案例 →</a></div>';
    html += '</div></div>';
  });
  html += '<div class="section-header"><span class="dot classic"></span> 经典案例</div>';
  const cls = data.classic;
  if (cls) {
    html += '<div class="case-card"><div class="case-title">' + cls.title + '</div><div class="case-meta"><span>' + (cls.brand || '') + '</span>' + (cls.agency ? '<span class="tag">' + cls.agency + '</span>' : '') + '</div><div class="case-detail">';
    if (cls.goal) html += '<div class="field"><span class="label">商业目标</span>' + cls.goal + '</div>';
    if (cls.problem) html += '<div class="field"><span class="label">核心问题</span>' + cls.problem + '</div>';
    if (cls.insight) html += '<div class="field"><span class="label">核心洞察</span>' + cls.insight + '</div>';
    if (cls.task) html += '<div class="field"><span class="label">传播任务</span>' + cls.task + '</div>';
    if (cls.idea) html += '<div class="field"><span class="label">创意构思</span>' + cls.idea + '</div>';
    if (cls.link) html += '<div class="field"><a class="link" href="' + cls.link + '" target="_blank" rel="noopener">🔗 查看原案例 →</a></div>';
    html += '</div></div>';
  }
  if (data.quote && data.quote.text) {
    html += '<div class="quote-section"><div class="quote-text">' + data.quote.text + '</div><div class="quote-author">—— ' + data.quote.author + '</div>';
    if (data.quote.translation) {
      html += '<div class="quote-translation">' + data.quote.translation + '</div>';
    }
    html += '</div>';
  }
  document.getElementById('contentArea').innerHTML = html;
  document.getElementById('prevBtn').disabled = currentIndex >= dates.length - 1;
  document.getElementById('nextBtn').disabled = currentIndex <= 0;
}

function navigate(dir) {
  const newIdx = currentIndex - dir;
  if (newIdx < 0 || newIdx >= dates.length) return;
  currentIndex = newIdx;
  renderDate(dates[currentIndex]);
  window.scrollTo({ top: document.querySelector('.nav-bar').offsetTop - 10, behavior: 'smooth' });
}

if (dates.length > 0) renderDate(dates[0]);
</script>
</body>
</html>
