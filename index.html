<style>
:root {
  --bg: #ffffff;
  --surface: #f7f7f8;
  --surface2: #eeeeef;
  --border: #e0e0e2;
  --text: #1a1a1e;
  --text2: #6b6b72;
  --text3: #9c9ca3;
  --accent: #d4a307;
  --accent2: #b8920a;
  --tag-bg: rgba(212, 163, 7, 0.08);
  --tag-text: #a37e08;
  --card-radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
.hero {
  text-align: center; padding: 60px 20px 40px;
  background: linear-gradient(180deg, #faf6ee 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
}
.hero h1 { font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
.hero h1 span { color: var(--accent); }
.hero .subtitle { color: var(--text2); font-size: 14px; margin-bottom: 16px; }
.hero .badge {
  display: inline-block; background: var(--tag-bg); color: var(--tag-text);
  padding: 4px 14px; border-radius: 20px; font-size: 12px; letter-spacing: 1px;
}
.nav-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
}
.nav-bar .nav-date { font-size: 18px; font-weight: 600; }
.nav-bar .nav-arrows { display: flex; gap: 8px; }
.nav-bar .nav-arrows button {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px;
  transition: all .2s;
}
.nav-bar .nav-arrows button:hover { background: var(--surface2); }
.nav-bar .nav-arrows button:disabled { opacity: 0.3; cursor: not-allowed; }
.case-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 20px; margin-bottom: 16px;
}
.case-card:hover { border-color: #ccc; }
.case-card .case-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.case-card .case-title .case-num { color: var(--accent); margin-right: 8px; }
.case-card .case-meta { color: var(--text3); font-size: 13px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.case-card .case-meta .tag { background: var(--surface2); padding: 2px 10px; border-radius: 4px; font-size: 12px; }
.case-detail { display: grid; gap: 8px; }
.case-detail .field { font-size: 14px; line-height: 1.7; }
.case-detail .field .label { color: var(--text3); font-size: 12px; display: block; margin-bottom: 2px; }
.case-detail .field .link { color: var(--accent); text-decoration: none; word-break: break-all; font-size: 13px; }
.case-detail .field .link:hover { text-decoration: underline; }
.section-header {
  font-size: 14px; font-weight: 600; color: var(--text2);
  margin: 28px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.section-header .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.section-header .dot.fresh { background: #4ade80; }
.section-header .dot.classic { background: #f97316; }
.quote-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 24px; margin: 24px 0; text-align: center;
}
.quote-section .quote-text { font-size: 15px; font-style: italic; line-height: 1.8; margin-bottom: 8px; }
.quote-section .quote-author { color: var(--text3); font-size: 13px; }
.quote-section .quote-translation { color: var(--text2); font-size: 14px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.cta-section {
  margin: 40px 0; padding: 32px 24px;
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border: 1px solid var(--border); border-radius: var(--card-radius); text-align: center;
}
.cta-section h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.cta-section p { color: var(--text2); font-size: 14px; margin-bottom: 20px; }
.cta-section .cta-btn {
  display: inline-block; background: var(--accent); color: #fff;
  padding: 12px 32px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: default;
}
.cta-section .cta-note { color: var(--text3); font-size: 12px; margin-top: 12px; }
.footer { text-align: center; padding: 32px 0; color: var(--text3); font-size: 12px; border-top: 1px solid var(--border); }
@media (max-width: 600px) {
  .hero { padding: 40px 16px 28px; }
  .hero h1 { font-size: 24px; }
  .case-card { padding: 16px; }
  .case-card .case-title { font-size: 16px; }
  .container { padding: 0 14px; }
}
</style>
</head>
<body>

<div class="hero">
  <h1>📰 每日广告案例<span>早报</span></h1>
  <p class="subtitle">每天3个新鲜案例 + 1个经典案例 · 精炼拆解 · 广告人早八点必读</p>
  <span class="badge">每日更新 · 免费预览最近 7 天内容</span>
</div>

<div class="container">

<div class="nav-bar">
  <div class="nav-date" id="currentDate">—</div>
  <div class="nav-arrows">
    <button id="prevBtn" onclick="navigate(-1)">◂</button>
    <button id="nextBtn" onclick="navigate(1)">▸</button>
  </div>
</div>

<div id="contentArea"><div class="loading">加载中...</div></div>

<div class="cta-section">
  <h3>🔒 订阅获取完整每日推送</h3>
  <p>每日早八点准时送达，不错过任何一个精彩案例。</p>
  <div class="cta-btn">订阅入口 · 即将开放</div>
  <p class="cta-note">当前免费预览最近 7 天内容展示，正式订阅即将上线</p>
</div>

</div>

<div class="footer"><p>每日广告案例早报 &copy; &mdash; 广告案例精选与拆解</p></div>

<script>
// ===================== DATA =====================
const BRIEFINGS = {};

BRIEFINGS['2026.07.02'] = {
  "date": "2026.07.02",
  "fresh": [
    {
      "num": 1,
      "title": "Nike — Rip the Script（撕掉剧本）",
      "brand": "Nike·运动服饰/体育",
      "agency": "Wieden+Kennedy",
      "goal": "借2026世界杯重振Nike品牌创意声量，以一部六分钟品牌影片为核心，扭转近年销售疲软与品牌老化趋势，在社交媒体时代重建「Nike式」的文化领导力。",
      "problem": "在Adidas以球星阵容碾压、各品牌疯狂抢占世界杯注意力时，Nike如何在销售下滑与创意褪色的双重困境下，不靠明星堆砌而是重新找回「敢于打破规则」的品牌灵魂？",
      "insight": "年轻一代不再满足于被动观看品牌故事——他们要参与、要剪辑、要二创、要成为故事的一部分。Nike不应做一支传统广告，而应构建一个可被粉丝自由拆解、重组、传播的「内容宇宙」，让每一次分享都成为品牌的延伸。",
      "task": "以「Rip the Script」为全球平台主题，通过六分钟品牌长片+社交媒体碎片化内容+球星深度共创，将世界杯营销从「单向广告投放」升级为「多向文化对话」，驱动超15亿次社交传播。",
      "idea": "W+K邀请姆巴佩、哈兰德等足坛巨星与Kim Kardashian等跨界名人共同出演，但镜头C位留给每一个「打破常规」的普通人——从街头足球少年到女性裁判。全片以「撕掉旧剧本」为行动线索，不设固定结局，鼓励全球创作者将影片拆解、混剪、改编，让品牌故事由千万个声音共同讲述。",
      "link": "https://www.adsoftheworld.com/campaigns/rip-the-script"
    },
    {
      "num": 2,
      "title": "Spotify — Great Lengths（为了见你，什么都做得出来）",
      "brand": "Spotify·音乐流媒体/科技",
      "agency": "Remembers",
      "goal": "推广Spotify新功能Reserved（为忠实粉丝提供优先购票权），将流媒体平台从「听歌工具」升级为「连接粉丝与艺人的情感桥梁」，驱动付费订阅与用户粘性增长。",
      "problem": "演唱会抢票已是粉丝的最大痛点——黄牛泛滥、排队无望、一票难求。Spotify拥有最丰富的用户听歌数据，天然知道谁是「真粉丝」，但如何让消费者直观感受到这一功能价值而不陷入功能说教？",
      "insight": "真正的铁粉为了见偶像一面愿意做任何疯狂的事——卖头发、旷工、穿越沙漠、甚至和魔鬼做交易。这些「极端行为」看似荒诞，却是粉丝经济的核心情感密码：爱的深度，用愿意付出的代价来衡量。Reserved正是让这种「疯狂」变得不再必要。",
      "task": "以一支手绘动画短片夸张呈现粉丝的极端追星行为，通过户外广告+社交视频将Reserved功能定位为「铁粉的专属通行证」，让Spotify从听歌平台切入现场演出经济。",
      "idea": "导演Jocelyn Charles以马克笔手绘+逐帧动画打造超现实视觉风格——粉丝在无尽沙漠排队、向网络女巫求购咒语、缺席祖母葬礼只为抢票。全片以黑色幽默放大「没有Reserved之前的世界有多荒诞」，让功能价值在笑声中完成传递。同步推出纽约、洛杉矶等城市的演出场馆周边户外广告。",
      "link": "https://www.adweek.com/creativity/spotify-lures-fans-to-reserved-with-a-promise-no-more-extreme-lengths-necessary/"
    },
    {
      "num": 3,
      "title": "IKEA — 平价杰作（Affordable Masterpieces）",
      "brand": "IKEA·家居零售/设计",
      "agency": "Memac Ogilvy",
      "goal": "打破「平价=低端」的消费偏见，将IKEA重新定位为「永恒设计的民主化推手」，以艺术史叙事提升品牌价值感知并斩获2026戛纳国际创意节印刷类铜狮。",
      "problem": "IKEA长期被贴上「廉价组装家具」的标签，在高端设计话语权争夺中天然处于劣势。品牌如何不说「我们也很高级」，而是用一个无从反驳的视觉证据——让世界名画自己开口为IKEA辩护？",
      "insight": "翻开全球各大美术馆的传世名画——从文艺复兴到印象派——画中竟藏着大量与IKEA经典产品高度相似的家具设计。这不是巧合，而是印证了一个真理：真正优秀的设计能跨越数百年，从画布走入寻常百姓家。IKEA不创造潮流，而是让好设计变得人人买得起。",
      "task": "以「Affordable Masterpieces」为主题，将世界名画与IKEA产品进行视觉对照，通过平面海报+社交媒体传播，将品牌从「便宜货」重新定义为「被时间验证的好设计」，强化设计民主化的品牌哲学。",
      "idea": "Memac Ogilvy精心挑选了来自卢浮宫、大都会博物馆等的数幅名画，将画中家具与IKEA产品进行无缝并置对比——维米尔画中的椅子与IKEA经典座椅、文艺复兴画中的桌子与LACK边桌——每张海报都是一堂无声的设计史课，让消费者自发感叹：「原来大师和我用同一款。」",
      "link": "https://www.meihua.info/shots/6889970286857216"
    }
  ],
  "classic": {
    "title": "Apple — 1984（1984）",
    "brand": "Apple·科技/个人电脑",
    "agency": "Chiat/Day",
    "goal": "在IBM垄断个人电脑市场的1984年，以一支仅在超级碗播出一次的60秒广告，宣告Macintosh的诞生——不是卖一台电脑，而是向全世界宣告一个新时代的到来。",
    "problem": "1983年的个人电脑市场由IBM完全主导，Apple份额不足10%。在消费者眼中，电脑是穿着灰色西装的企业工具。Apple如何在超级碗这个全美最大舞台上，只用60秒让所有人相信：这个无名小公司会改变世界？",
    "insight": "1984年不仅是日历上的一年，更是乔治·奥威尔笔下「老大哥」监视一切的极权象征。IBM的灰色垄断恰如那个控制一切的大屏幕。Apple不需要比较参数——它只需要借用「1984」这个文化符号，将自己定位为砸碎屏幕的锤子，而非另一个上架的新产品。",
    "task": "以一支反乌托邦叙事短片将Macintosh的发布打造为一场「自由宣言」——不介绍产品功能，不比较价格，只用视觉冲击与叙事张力让观众在60秒内完成从「Apple是谁」到「我必须是Apple阵营」的心智转变。",
    "idea": "导演Ridley Scott以《银翼杀手》式冷峻美学构建了一个灰色未来——无数光头工人机械地聆听「老大哥」在大屏幕上的宣讲。一位身穿白色背心和红色短裤的女运动员手持铁锤冲入会场，拼尽全力将铁锤砸向屏幕，屏幕应声爆炸。旁白响起：「1月24日，Apple将推出Macintosh。你会看到，为什么1984不会变成《1984》。」这支广告仅在1984年1月22日第18届超级碗播出一次，却成为广告史上最著名的60秒。它证明了：最好的广告不是在卖产品，而是在邀请消费者成为一场革命的一部分。",
    "link": ""
  },
  "quote": null
};
const dates = Object.keys(BRIEFINGS).sort().reverse();
let currentIndex = 0;

function renderDate(dateStr) {
  const data = BRIEFINGS[dateStr];
  if (!data) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-state">暂无该日期内容</div>';
    document.getElementById('currentDate').textContent = dateStr;
    return;
  }
  const d = new Date(dateStr);
  const weekday = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('currentDate').textContent = dateStr + ' 周' + weekday;
  let html = '';
  html += '<div class="section-header"><span class="dot fresh"></span> 新鲜案例</div>';
  data.fresh.forEach(c => {
    html += '<div class="case-card"><div class="case-title"><span class="case-num">#' + c.num + '</span>' + c.title + '</div><div class="case-meta"><span>' + (c.brand || '') + '</span>' + (c.agency ? '<span class="tag">' + c.agency + '</span>' : '') + '</div><div class="case-detail">';
    if (c.goal) html += '<div class="field"><span class="label">商业目标</span>' + c.goal + '</div>';
    if (c.problem) html += '<div class="field"><span class="label">核心问题</span>' + c.problem + '</div>';
    if (c.insight) html += '<div class="field"><span class="label">核心洞察</span>' + c.insight + '</div>';
    if (c.task) html += '<div class="field"><span class="label">传播任务</span>' + c.task + '</div>';
    if (c.idea) html += '<div class="field"><span class="label">创意构思</span>' + c.idea + '</div>';
    if (c.link) html += '<div class="field"><a class="link" href="' + c.link + '" target="_blank" rel="noopener">🔗 查看原案例 →</a></div>';
    html += '</div></div>';
  });
  html += '<div class="section-header"><span class="dot classic"></span> 经典案例</div>';
  const cls = data.classic;
  if (cls) {
    html += '<div class="case-card"><div class="case-title">' + cls.title + '</div><div class="case-meta"><span>' + (cls.brand || '') + '</span>' + (cls.agency ? '<span class="tag">' + cls.agency + '</span>' : '') + '</div><div class="case-detail">';
    if (cls.goal) html += '<div class="field"><span class="label">商业目标</span>' + cls.goal + '</div>';
    if (cls.problem) html += '<div class="field"><span class="label">核心问题</span>' + cls.problem + '</div>';
    if (cls.insight) html += '<div class="field"><span class="label">核心洞察</span>' + cls.insight + '</div>';
    if (cls.task) html += '<div class="field"><span class="label">传播任务</span>' + cls.task + '</div>';
    if (cls.idea) html += '<div class="field"><span class="label">创意构思</span>' + cls.idea + '</div>';
    if (cls.link) html += '<div class="field"><a class="link" href="' + cls.link + '" target="_blank" rel="noopener">🔗 查看原案例 →</a></div>';
    html += '</div></div>';
  }
  if (data.quote && data.quote.text) {
    html += '<div class="quote-section"><div class="quote-text">' + data.quote.text + '</div><div class="quote-author">—— ' + data.quote.author + '</div>';
    if (data.quote.translation) {
      html += '<div class="quote-translation">' + data.quote.translation + '</div>';
    }
    html += '</div>';
  }
  document.getElementById('contentArea').innerHTML = html;
  document.getElementById('prevBtn').disabled = currentIndex >= dates.length - 1;
  document.getElementById('nextBtn').disabled = currentIndex <= 0;
}

function navigate(dir) {
  const newIdx = currentIndex - dir;
  if (newIdx < 0 || newIdx >= dates.length) return;
  currentIndex = newIdx;
  renderDate(dates[currentIndex]);
  window.scrollTo({ top: document.querySelector('.nav-bar').offsetTop - 10, behavior: 'smooth' });
}

if (dates.length > 0) renderDate(dates[0]);
</script>
</body>
</html>
