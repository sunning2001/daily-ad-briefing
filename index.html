      "task":"联合中国纺织信息中心发布《体感科学报告》，以学术级严谨将主观感受转化为客观标准。",
      "idea":"联合中央芭蕾舞团拍摄十周年影片，舞者身体各部位由其他舞者共同组成——\"让身体组成身体\"，隐喻人人共享舒服的权利。",
      "link":"https://www.digitaling.com/projects/366505.html"
    }
  ],
  "classic":{
    "title":"Apple — 1984（1984）",
    "brand":"Apple · 科技",
    "agency":"Chiat/Day",
    "goal":"在超级碗发布Macintosh，用一支广告让世界记住这个挑战IBM垄断的新品牌。",
    "problem":"个人电脑市场被IBM统治，无人知晓的新品牌如何在80秒内宣告一个时代来临？",
    "insight":"Macintosh不是另一台电脑——它是反抗思想控制、解放个体创造力的武器，科技具有政治隐喻。",
    "task":"创造史上最轰动的超级碗广告，让产品发布成为全球文化事件而非一场普通发布会。",
    "idea":"Ridley Scott以奥威尔《1984》为蓝本，女子挥锤砸碎老大哥屏幕，宣告\"1月24日Apple推出Macintosh，1984不会像《1984》。",
    "link":"https://en.wikipedia.org/wiki/1984_(advertisement)"
  },
  "quote":{
    "text":"\"Properly practiced creativity can make one ad do the work of ten.\"",
    "author":"Bill Bernbach（DDB创始人，广告创意革命之父）"
  }
};

// ===================== APPLICATION =====================
const dates = Object.keys(BRIEFINGS).sort().reverse();
let currentIndex = 0;

function renderDate(dateStr) {
  const data = BRIEFINGS[dateStr];
  if (!data) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-state">暂无该日期内容</div>';
    document.getElementById('currentDate').textContent = dateStr;
    return;
  }

  document.getElementById('currentDate').textContent = dateStr;
  const d = new Date(dateStr);
  const weekday = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('currentDate').textContent = `${dateStr} 周${weekday}`;

  let html = '';

  // 新鲜案例
  html += '<div class="section-header"><span class="dot fresh"></span> 新鲜案例</div>';
  data.fresh.forEach(c => {
    html += `<div class="case-card">
      <div class="case-title"><span class="case-num">#${c.num}</span>${c.title}</div>
      <div class="case-meta"><span>${c.brand}</span><span class="tag">${c.agency}</span></div>
      <div class="case-detail">
        <div class="field"><span class="label">商业目标</span>${c.goal}</div>
        <div class="field"><span class="label">核心问题</span>${c.problem}</div>
        <div class="field"><span class="label">核心洞察</span>${c.insight}</div>
        <div class="field"><span class="label">传播任务</span>${c.task}</div>
        <div class="field"><span class="label">创意构思</span>${c.idea}</div>
        ${c.link ? `<div class="field"><a class="link" href="${c.link}" target="_blank" rel="noopener">🔗 查看原案例 →</a></div>` : ''}
      </div>
    </div>`;
  });

  // 经典案例
  html += '<div class="section-header"><span class="dot classic"></span> 经典案例</div>';
  const cls = data.classic;
  html += `<div class="case-card">
    <div class="case-title">${cls.title}</div>
    <div class="case-meta"><span>${cls.brand}</span><span class="tag">${cls.agency}</span></div>
    <div class="case-detail">
      <div class="field"><span class="label">商业目标</span>${cls.goal}</div>
      <div class="field"><span class="label">核心问题</span>${cls.problem}</div>
      <div class="field"><span class="label">核心洞察</span>${cls.insight}</div>
      <div class="field"><span class="label">传播任务</span>${cls.task}</div>
      <div class="field"><span class="label">创意构思</span>${cls.idea}</div>
      ${cls.link ? `<div class="field"><a class="link" href="${cls.link}" target="_blank" rel="noopener">🔗 查看原案例 →</a></div>` : ''}
    </div>
  </div>`;

  // 金句
  if (data.quote && data.quote.text) {
    html += `<div class="quote-section">
      <div class="quote-text">${data.quote.text}</div>
      <div class="quote-author">—— ${data.quote.author}</div>
    </div>`;
  }

  document.getElementById('contentArea').innerHTML = html;
  updateNavButtons();
}

function updateNavButtons() {
  document.getElementById('prevBtn').disabled = currentIndex >= dates.length - 1;
  document.getElementById('nextBtn').disabled = currentIndex <= 0;
}

function navigate(dir) {
  const newIdx = currentIndex - dir;
  if (newIdx < 0 || newIdx >= dates.length) return;
  currentIndex = newIdx;
  renderDate(dates[currentIndex]);
  window.scrollTo({ top: document.querySelector('.nav-bar').offsetTop - 10, behavior: 'smooth' });
}

// Init
renderDate(dates[0]);
</script>
</body>
</html>
